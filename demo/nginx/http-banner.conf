# WADJET lab — banner-rich plain HTTP endpoint.
# Deliberately chatty: full version disclosure + fingerprintable headers so
# nmap NSE scripts (http-headers, http-server-header, http-title) and WADJET
# service fingerprinting have real material to report.
server {
    listen 80 default_server;
    server_name http-banner.lab;

    # On purpose: show the exact nginx version in the Server header.
    server_tokens on;
    server_info on;

    root /usr/share/nginx/html;
    index index.html;

    # Extra banner noise.
    add_header X-Powered-By "WADJET-LAB/1.0 (SecureStack Commercial Edition)" always;
    add_header X-Debug-Mode "enabled" always;
    add_header X-Internal-Host "lb-03.lab.internal" always;
    add_header X-Build-Date "Mon, 01 Apr 2019 08:00:00 GMT" always;
    add_header Server-Build "nginx-nss/1.2" always;

    location / {
        default_type text/html;
        return 200 "<html><head><title>WADJET Lab — Internal Portal (DO NOT EXPOSE)</title></head>
<body><h1>WADJET Lab Internal Portal</h1>
<p>demo data — banner-rich test endpoint</p>
<!-- TODO: remove debug endpoints before go-live — admin panel at /admin -->
</body></html>\n";
    }

    # 404 page also leaks the fingerprint stack.
    error_page 404 /404.html;
    location = /404.html {
        default_type text/html;
        return 404 "<html><head><title>Not Found</title></head><body><h1>404</h1>
<p>WADJET-LAB error stack v2.1 (debug build)</p></body></html>\n";
    }
}
