# WADJET lab — TLS test endpoint.
#
# Self-signed certificate (generated on first container start into the
# tls-certs volume) and INTENTIONALLY permissive protocol/cipher settings so
# scanners flag real TLS weaknesses.
#
# ── DEPRECATED PROTOCOL CONFIGURATION — DEMO USE ONLY ──────────────────────
#   * TLS 1.0 and TLS 1.1 are enabled below. They are deprecated by
#     RFC 8996 and flagged by every competent scanner (ssl-enum-ciphers,
#     ssl-cert, testssl.sh).
#   * A weak cipher suite list including RC4/3DES-era strings is served.
#   * The certificate is self-signed, SHA-256, 2048-bit RSA, CN=tls.lab.
# NEVER copy this configuration into a production deployment.
# ────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name tls.lab;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Deprecated protocols enabled ON PURPOSE for scanner demonstrations.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    # Old-style weak suites ON PURPOSE (matches what NSE's ssl-enum-ciphers
    # reports as A- or worse).
    ssl_ciphers ALL:@SECLEVEL=1;
    ssl_prefer_server_ciphers on;

    ssl_session_cache shared:LabSSL:1m;
    ssl_session_timeout 5m;

    add_header X-Backend "legacy-payment-gateway-lab" always;

    location / {
        default_type text/html;
        return 200 "<html><body><h1>WADJET Lab TLS endpoint</h1>
<p>demo data — self-signed cert, deprecated protocols enabled</p></body></html>\n";
    }
}
